name: Build SM-T220 Custom Kernel & Driver

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    name: Compile Kernel & Package boot.img
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev python3 make gcc-aarch64-linux-gnu \
            libelf-dev curl tar gzip libncurses5-dev ca-certificates

      - name: Prepare Scripts & Toolchains
        run: |
          chmod +x build.sh repack_boot.py
          mkdir -p toolchain/clang/host/linux-x86/clang-r383902
          mkdir -p toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

          echo "Downloading Google AOSP Clang r383902..."
          curl -fsSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" | tar -xz -C toolchain/clang/host/linux-x86/clang-r383902

          echo "Downloading Google AOSP GCC 4.9 (aarch64)..."
          curl -fsSL "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android11-release.tar.gz" | tar -xz -C toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

      - name: Compile Kernel & Repack boot.img
        run: |
          ./build.sh

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_package
          cp boot.img release_package/
          if [ -f KernelSU_v3.3.1_32680-release.apk ]; then
            cp KernelSU_v3.3.1_32680-release.apk release_package/
          fi
          if [ -d driver ]; then
            cp -r driver release_package/
          fi
          ls -la release_package/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-T220-KernelSU-CustomKernel
          path: release_package/*
